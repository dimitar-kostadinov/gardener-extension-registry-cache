apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../example

patches:
- patch: |
    - op: replace
      path: /helm/values
      value:
        image:
          ref: local-skaffold/gardener-extension-registry-cache:v0.0.0
        imageVectorOverwrite:
          images:
          - name: spegel-peers
            ref: registry.local.gardener.cloud:5001/local-skaffold_gardener-extension-registry-cache-spegel-peers:v0.20.0-7-gb7c9a6db@sha256:68d713057fcecfcf009c0c6e754e5446e953441916d6dafb7ba3569f5b81c1d9
  target:
    group: core.gardener.cloud
    kind: ControllerDeployment
    name: extension-registry-cache