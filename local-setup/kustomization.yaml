apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../example

patches:
- patch: |
    - op: replace
      path: /helm/values
      value:
        image:
          ref: local-skaffold/gardener-extension-registry-cache:v0.0.0
        imageVectorOverwrite:
          images:
          - name: spegel-peers
            ref: registry.local.gardener.cloud:5001/local-skaffold_gardener-extension-registry-cache-spegel-peers:v0.20.0-9-g3d6800c7-dirty@sha256:e7b19d02f3ca4ce12bc14079670506c1a6b3f1c24d205b51f85aa2dfb132e6d8
  target:
    group: core.gardener.cloud
    kind: ControllerDeployment
    name: extension-registry-cache