apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../example

patches:
- patch: |
    - op: replace
      path: /helm/values
      value:
        image:
          ref: local-skaffold/gardener-extension-registry-cache:v0.0.0
        imageVectorOverwrite:
          images:
          - name: spegel-peers
            ref: registry.local.gardener.cloud:5000/local-skaffold_gardener-extension-registry-cache-spegel-peers:v0.19.0-15-gde47fa68-dirty@sha256:cfb5b342a40db2bd6865941c60aec145ade9055561d2ab3130ec26710f65e561
  target:
    group: core.gardener.cloud
    kind: ControllerDeployment
    name: extension-registry-cache