apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../example

patches:
- patch: |
    - op: replace
      path: /helm/values
      value:
        image:
          ref: local-skaffold/gardener-extension-registry-cache:v0.0.0
        imageVectorOverwrite:
          images:
          - name: spegel-peers
            ref: registry.local.gardener.cloud:5001/local-skaffold_gardener-extension-registry-cache-spegel-peers:v0.20.0-12-g9b5f11b2-dirty@sha256:d186b6a6934e7fd6ff66e00437481c14e98271cf02754d61ed51d7f57ce81a3c
  target:
    group: core.gardener.cloud
    kind: ControllerDeployment
    name: extension-registry-cache